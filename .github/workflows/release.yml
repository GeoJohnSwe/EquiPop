# Publishing to PyPI with Trusted Publishing - no token anywhere.
#
# HOW A RELEASE IS MADE (CONTRIBUTING.md, section 6):
#   1. The release's changes are on main and the "tests" run is green.
#   2. On GitHub: Releases -> Draft a new release -> a new tag named
#      v<version>, e.g. v1.65.0, exactly the version in pyproject.toml
#      -> Publish release.
#   3. This workflow builds and checks the package. The upload then
#      waits in the "pypi" environment until a maintainer approves it
#      (repository Settings -> Environments -> pypi).
#
# PyPI trusts this file by name: the trusted publisher on PyPI is
# owner GeoCalista, repository EquiPop, workflow release.yml,
# environment pypi. Renaming this file, the repository or the
# environment breaks the trust until PyPI is told. BACKLOG 500.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build and check the package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: The tag must be the version in the code
        run: |
          V=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "pyproject.toml says $V, the release tag is $GITHUB_REF_NAME"
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not v$V. Delete the release and its tag, and make it again as v$V."
            exit 1
          fi
      - name: Build the wheel and the source archive
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel into a clean Python and run it
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/python" -I -c "import equipop, numpy as np; from equipop import stata_bridge as sb; r = sb.dispatch('counts', np.arange(5.0) * 100, np.zeros(5), k_values=[2]); assert list(r['N_2']) == [2.0] * 5, r; print('equipop', equipop.__version__, 'runs')"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 30

  publish:
    name: upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/equipop/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
