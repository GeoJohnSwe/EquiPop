[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equipop"
version = "1.44.8"
description = "k-nearest neighbour contexts/neighbourhoods on gridded and hexagonal data: bespoke neighbourhoods, friction growth, distance decay, statistics and segregation measures"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "John Östh", email = "johnosth@oslomet.no"}]
maintainers = [{name = "John Östh", email = "johnosth@oslomet.no"}]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "pyproj>=3.4"]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "pyogrio", "rasterio"]
io = ["openpyxl", "pyarrow", "pyreadstat", "dbfread"]
viz = ["matplotlib", "jenkspy"]
test = ["pytest", "openpyxl", "pyarrow", "rasterio"]

[project.urls]
Homepage = "https://github.com/GeoJohnSwe/EquiPop"

[tool.setuptools.packages.find]
include = ["equipop*"]

# The datasets the Book teaches from must travel INSIDE the wheel.
# Before 1.19.0 the loader reached out to ../examples and ../tests,
# which exist in a git clone and in the source archive but never in
# a pip install - so load("gridby"), the first line of chapter 1,
# failed for every student who installed from PyPI.
[tool.setuptools.package-data]
equipop = ["data/*.csv", "data/*.xlsx", "providers/*.json"]
